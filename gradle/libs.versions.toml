[versions]
agp = "9.1.0"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2025.05.01"
coreKtx = "1.16.0"
splashscreen = "1.2.0"
profileinstaller = "1.4.1"
activityCompose = "1.10.1"
navigationCompose = "2.10.2"
lifecycle = "2.9.0"
camerax = "1.7.0"
exifinterface = "1.4.1"
room = "2.8.5"
datastore = "1.3.0"
browser = "1.10.0"
print = "1.1.0"
zxing = "3.5.4"
eddsa = "0.3.0"
libphonenumber = "9.0.38"
libphonenumberGeocoder = "3.38"
