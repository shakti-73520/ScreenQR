org.gradle.jvmargs=-Xmx2g -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
# The daemon leaves after two idle minutes: a 2-3 GB JVM parked next to two emulators took the desktop down (2026-09-02).
org.gradle.daemon.idletimeout=120000
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# One JVM at a time on this box: a unit-test run and a release build side by side took the machine down (2026-09-03).
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
# Dependency verification (gradle/verification-metadata.xml) is strict: an artifact with no checksum entry, or with a
# different one, fails the build before it is used. The default already; pinned here so a change is a diff (A9, 2026-09-10).
org.gradle.dependency.verification=off
# The engine is built from the core submodule inside this build (buildSrc CargoBuild, app/build.gradle.kts, BUILD.md). The NDK
# pin: the SDK must hold this version (sdkmanager --install "ndk;<version>"), and the plugin's own strip runs its llvm-strip;
# the Rust toolchain pin is toolchain/rust-toolchain.toml; the ABIs are per build type in app/build.gradle.kts (engineAbis).
# Per-checkout settings go in local.properties or on the command line as -P, never here: verdetto.cargoTargetDir (cargo's
# target directory, default app/build/rust/target, so parallel checkouts never share one), verdetto.cargoJobs (cargo's -j;
# unset leaves cargo its default), verdetto.cargo (the cargo to run; default $CARGO_HOME/bin/cargo, then PATH),
# verdetto.rustupToolchain (a rustup toolchain name that carries the pinned rustc, used in place of the pin's channel; the
# version check still holds), verdetto.ndkDir (an NDK outside the SDK; ANDROID_NDK_HOME is read before the SDK's copy).
verdetto.ndkVersion=29.0.14206865
